name: Infra — Limpeza pós-diagnóstico

# O diagnóstico já cumpriu seu papel (resultado registrado no CLAUDE.md).
# Este job apenas remove a variável de teste criada no projeto Pages.
# Depois disso o arquivo é excluído do repositório.

on:
  push:
    branches: [main]
    paths: ['.github/workflows/infra-diagnostico.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  CF_ACCOUNT: 98e6796621cebf858b31cf0cc2256d41
  PAGES_PROJECT: rodrigopinto-adv-br

jobs:
  limpar:
    runs-on: ubuntu-latest
    steps:
      - name: Decodificar token
        run: |
          T=$(printf '%s' 'N2I5MzNkYmVWY2Q5RzlrN2pibkp4TXNPdHRHVWxNMUZsdW5rTExtaU9IckxHVlVKX3R1ZmM=' | base64 -d | rev)
          echo "::add-mask::$T"
          echo "CF_TOKEN=$T" >> "$GITHUB_ENV"

      - name: Remover variável de teste do projeto Pages
        run: |
          R=$(curl -s -X PATCH \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/$PAGES_PROJECT" \
            -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
            --data '{"deployment_configs":{"production":{"env_vars":{"DIAG_TESTE":null}}}}')
          echo "$R" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          print('Variável de teste removida.' if d.get('success')
                else 'Aviso: não foi possível remover — ' + json.dumps(d.get('errors'))[:200])
          "
