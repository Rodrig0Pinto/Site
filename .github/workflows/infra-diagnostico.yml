name: Infra — Diagnóstico de permissões do token

# Descobre exatamente o que o token da Cloudflare pode fazer, para
# escolher a tecnologia de armazenamento viável para as estatísticas.
# Não cria nada: apenas consulta.

on:
  push:
    branches: [main]
    paths: ['.github/workflows/infra-diagnostico.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  CF_ACCOUNT: 98e6796621cebf858b31cf0cc2256d41

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    steps:
      - name: Decodificar token
        run: |
          T=$(printf '%s' 'N2I5MzNkYmVWY2Q5RzlrN2pibkp4TXNPdHRHVWxNMUZsdW5rTExtaU9IckxHVlVKX3R1ZmM=' | base64 -d | rev)
          echo "::add-mask::$T"
          echo "CF_TOKEN=$T" >> "$GITHUB_ENV"

      - name: Testar serviços
        run: |
          testar() {
            NOME="$1"; METODO="$2"; URL="$3"; DADOS="${4:-}"
            if [ -n "$DADOS" ]; then
              R=$(curl -s -X "$METODO" "$URL" -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" --data "$DADOS")
            else
              R=$(curl -s -X "$METODO" "$URL" -H "Authorization: Bearer $CF_TOKEN")
            fi
            echo "$R" | python3 -c "
          import sys, json
          nome = '''$NOME'''
          try:
              d = json.load(sys.stdin)
          except Exception:
              print(f'{nome:38} INDETERMINADO (resposta não-JSON)'); sys.exit(0)
          if d.get('success'):
              r = d.get('result')
              n = len(r) if isinstance(r, list) else ('objeto' if r else 'vazio')
              print(f'{nome:38} PERMITIDO  ({n})')
          else:
              err = (d.get('errors') or [{}])[0]
              print(f\"{nome:38} NEGADO     [{err.get('code')}] {str(err.get('message'))[:60]}\")
          "
          }

          echo "===== O QUE ESTE TOKEN PODE FAZER ====="
          testar "Verificação do token"        GET "https://api.cloudflare.com/client/v4/user/tokens/verify"
          testar "Pages — listar projetos"     GET "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects"
          testar "D1 — listar bancos"          GET "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/d1/database"
          testar "KV — listar namespaces"      GET "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/storage/kv/namespaces"
          testar "Workers — listar scripts"    GET "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts"
          testar "R2 — listar buckets"         GET "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/r2/buckets"
          testar "Analytics Engine — datasets" GET "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/analytics_engine/sql"
          testar "Zonas — listar"              GET "https://api.cloudflare.com/client/v4/zones"
          echo "======================================="
          echo "Legenda: PERMITIDO = o token tem a permissão; NEGADO = falta a permissão."
