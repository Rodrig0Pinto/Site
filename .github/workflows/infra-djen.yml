# SONDA TEMPORÁRIA (2ª tentativa) — DJEN com cabeçalhos de navegador reais.
# Remover após a validação.
name: Infra — Sonda DJEN

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/infra-djen.yml'

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: DJEN por OAB com headers de navegador
        run: |
          set +e
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          for URL in \
            "https://comunicaapi.pje.jus.br/api/v1/comunicacao?numeroOab=12371&ufOab=PB&pagina=1&itensPorPagina=5" \
            "https://comunicaapi.pje.jus.br/api/v1/comunicacao?siglaTribunal=TJPB&numeroOab=12371&ufOab=PB&pagina=1&itensPorPagina=5"; do
            echo "--- $URL"
            CODE=$(curl -sS -o /tmp/r.json -w '%{http_code}' \
              -H "User-Agent: $UA" \
              -H "Accept: application/json, text/plain, */*" \
              -H "Accept-Language: pt-BR,pt;q=0.9" \
              -H "Referer: https://comunica.pje.jus.br/" \
              -H "Origin: https://comunica.pje.jus.br" \
              --connect-timeout 15 --max-time 40 "$URL")
            echo "HTTP $CODE ; bytes: $(wc -c < /tmp/r.json)"
            head -c 220 /tmp/r.json; echo
            python3 - <<'PY'
          import json
          try: d=json.load(open('/tmp/r.json'))
          except Exception as e: print('  (nao-JSON)'); raise SystemExit
          if isinstance(d,dict):
              print('  chaves:', sorted(d.keys())[:12])
              it=d.get('items') or d.get('itens') or d.get('content') or d.get('comunicacoes') or []
              print('  total:', d.get('count') or d.get('total') or d.get('totalElements') or d.get('totalRegistros'))
              if it: print('  campos:', sorted(it[0].keys())[:20]); print('  DJEN POR OAB: FUNCIONA')
          PY
          done
