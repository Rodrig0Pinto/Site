# SONDA TEMPORÁRIA (somente leitura de DNS). Remover após rodar.
name: Sonda DNS
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sonda-dns.yml']
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: |
          D=rodrigopinto.adv.br
          for s in 1.1.1.1 8.8.8.8; do
            echo "===== resolvedor $s"
            echo "-- MX:";     dig +short MX $D @$s
            echo "-- SPF/Apple:"; dig +short TXT $D @$s
            echo "-- DMARC:";  dig +short TXT _dmarc.$D @$s
            echo "-- DKIM:";   dig +short TXT sig1._domainkey.$D @$s | cut -c1-60
            echo "-- www:";    dig +short A www.$D @$s
          done
