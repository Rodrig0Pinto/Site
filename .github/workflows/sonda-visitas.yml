# SONDA TEMPORÁRIA v2 — contadores (ago/set) + teste de /api/hit. Remover após rodar.
name: Sonda Visitas
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sonda-visitas.yml']
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          set +e
          echo "== /api/hit responde? (UA curl = robô, não conta)"
          curl -sS -X POST -H "Content-Type: application/json" -d '{"p":"/"}' -w " [HTTP %{http_code}]\n" https://rodrigopinto-adv-br.pages.dev/api/hit
          echo "== abacus total (direto):"; curl -sS https://abacus.jasoncameron.dev/get/rpadvbr-a8f3c1/total; echo
          echo "== chaves:"
          for k in g-br-na c-na p-home p-artigos p-area-cliente p-direito-bancario d-20260801 d-20260802 d-20260803 d-20260804 d-20260805 d-20260806 d-20260807 d-20260808 d-20260809 d-20260810 d-20260811 d-20260812 d-20260813 d-20260814 d-20260815 d-20260816 d-20260817 d-20260818 d-20260819 d-20260820 d-20260821 d-20260822 d-20260823 d-20260824 d-20260825 d-20260826 d-20260827 d-20260828 d-20260829 d-20260830 d-20260831 d-20260901 d-20260902 d-20260903 d-20260904 d-20260905 d-20260906 d-20260907 d-20260908 d-20260909 d-20260910 d-20260911; do
            v=$(curl -sS --max-time 15 "https://abacus.jasoncameron.dev/get/rpadvbr-a8f3c1/$k" | grep -oE '"value":[0-9]+' | grep -oE '[0-9]+')
            [ -n "$v" ] && [ "$v" != "0" ] && echo "$k=$v"
          done
          true
