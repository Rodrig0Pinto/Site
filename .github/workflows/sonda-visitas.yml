# SONDA TEMPORÁRIA v3 — diagnóstico do contador diário. Gera UMA visita de teste
# (p=/zz-diagnostico) para verificar se a chave do dia é criada. Remover após rodar.
name: Sonda Visitas
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sonda-visitas.yml']
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          set +e
          A=https://abacus.jasoncameron.dev; NS=rpadvbr-a8f3c1; HOJE=$(TZ=America/Fortaleza date +%Y%m%d)
          g(){ curl -sS --max-time 15 -w " [HTTP %{http_code}]" "$A/get/$NS/$1"; echo; }
          echo "== ANTES: total / d-$HOJE / p-zz-diagnostico"; g total; g d-$HOJE; g p-zz-diagnostico
          echo "== 1) criar chave NOVA direto no Abacus (zz-teste-criacao):"
          curl -sS --max-time 15 -w " [HTTP %{http_code}]\n" "$A/hit/$NS/zz-teste-criacao"
          echo "== 2) visita de teste pela função real (UA de navegador):"
          curl -sS -X POST -A "Mozilla/5.0 (Macintosh; Intel Mac OS X 14_0) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36" \
            -H "Content-Type: application/json" -d '{"p":"/zz-diagnostico"}' -w " [HTTP %{http_code}]\n" https://rodrigopinto-adv-br.pages.dev/api/hit
          sleep 4
          echo "== DEPOIS: total / d-$HOJE / p-zz-diagnostico / zz-teste-criacao"; g total; g d-$HOJE; g p-zz-diagnostico; g zz-teste-criacao
          echo "== reserva CounterAPI tem a chave do dia?"; curl -sS --max-time 15 -w " [HTTP %{http_code}]\n" "https://api.counterapi.dev/v1/$NS/d-$HOJE"
          true
