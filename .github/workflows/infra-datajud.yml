# SONDA TEMPORÁRIA — valida a conectividade real com a API pública do DataJud/CNJ
# usada pela Área do Cliente (/api/processo). Remover após a validação.
name: Infra — Sonda DataJud

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/infra-datajud.yml'

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consulta de validação (TJPB)
        run: |
          set -e
          BASE="https://api-publica.datajud.cnj.jus.br"
          CHAVE="cDZHYzlZa0JadVREZDJCendQbXY6SkJlTzNjLV9TRENyQk1RdnFKZGRQdw=="

          echo "== 1) match_all: pega um processo real do TJPB =="
          R1=$(curl -sS -X POST "$BASE/api_publica_tjpb/_search" \
            -H "Authorization: APIKey $CHAVE" \
            -H "Content-Type: application/json" \
            -d '{"query":{"match_all":{}},"size":1}')
          NUM=$(echo "$R1" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['hits']['hits'][0]['_source']['numeroProcesso'])")
          echo "processo de amostra: $NUM"

          echo "== 2) consulta por numero (mesma query da funcao /api/processo) =="
          R2=$(curl -sS -X POST "$BASE/api_publica_tjpb/_search" \
            -H "Authorization: APIKey $CHAVE" \
            -H "Content-Type: application/json" \
            -d "{\"query\":{\"match\":{\"numeroProcesso\":\"$NUM\"}},\"size\":10}")
          echo "$R2" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          hits = d['hits']['hits']
          assert hits, 'consulta por numero nao retornou hits'
          s = hits[0]['_source']
          print('OK — tribunal:', s.get('tribunal'))
          print('OK — classe:', (s.get('classe') or {}).get('nome'))
          print('OK — movimentos:', len(s.get('movimentos') or []))
          print('VALIDACAO DATAJUD: SUCESSO')
          "
