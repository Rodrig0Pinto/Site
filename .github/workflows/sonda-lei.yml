name: Sonda temporária — leitura de texto legal
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sonda-lei.yml']
jobs:
  ler:
    runs-on: ubuntu-latest
    steps:
      - name: Ler fontes (somente leitura)
        run: |
          pip -q install html2text >/dev/null 2>&1 || true
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          ler() { echo "=================== $1"; curl -sSL -m 40 -A "$UA" "$1" -o p.html -w "HTTP %{http_code}\n" || true; python3 -c "import html2text,sys;h=html2text.HTML2Text();h.ignore_links=False;h.body_width=0;print(h.handle(open('p.html',encoding='utf-8',errors='ignore').read()))" | grep -v '^\s*$' | head -${2:-250}; }
          ler "https://leis.org/municipais/pb/joao-pessoa/lei/lei-ordinaria/2025/15466/lei-ordinaria-n-15466-2025-estabelece-a-caracterizacao-como-amostra-gratis-para-emprestimos-bancarios-concedidos-sem-solicitacao-do-consumidor-residente-no-municipio-de-joao" 300
          ler "https://leismunicipais.com.br/a/pb/j/joao-pessoa/lei-ordinaria/2025/1547/15466/lei-ordinaria-n-15466-2025" 200
          ler "https://paraibabusiness.com.br/joao-pessoa-aprova-lei-que-considera-emprestimos-nao-solicitados-como-amostras-gratis/" 150
          echo "=================== STF ADPF 1038"
          curl -sSL -m 40 -A "$UA" "https://portal.stf.jus.br/processos/listarProcessos.asp?classe=ADPF&numeroProcesso=1038" -o s.html -w "HTTP %{http_code} %{url_effective}\n" || true
          INC=$(grep -o 'incidente=[0-9]*' s.html | head -1 | cut -d= -f2); echo "incidente=$INC"
          if [ -n "$INC" ]; then
            for t in abaAndamentos abaDecisoes abaSessao; do echo "--- $t"; curl -sSL -m 40 -A "$UA" -e "https://portal.stf.jus.br/processos/detalhe.asp?incidente=$INC" "https://portal.stf.jus.br/processos/$t.asp?incidente=$INC&imprimir=" -o a.html -w "HTTP %{http_code}\n"; python3 -c "import html2text;h=html2text.HTML2Text();h.body_width=0;print(h.handle(open('a.html',encoding='utf-8',errors='ignore').read()))" | grep -v '^\s*$' | head -80; done
          fi
