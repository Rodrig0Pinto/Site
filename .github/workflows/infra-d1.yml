name: Infra — Banco de estatísticas (D1)

# Provisiona o banco D1 usado pelo contador de visitas e o vincula ao
# projeto Pages. É idempotente: se o banco já existe, apenas reaplica o
# schema e garante o vínculo. Roda quando este arquivo ou o schema mudam.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/infra-d1.yml'
      - 'db/schema.sql'
  workflow_dispatch:

permissions:
  contents: read

env:
  CF_ACCOUNT: 98e6796621cebf858b31cf0cc2256d41
  DB_NAME: rp-estatisticas
  PAGES_PROJECT: rodrigopinto-adv-br

jobs:
  provisionar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Decodificar token Cloudflare
        run: |
          T=$(printf '%s' 'N2I5MzNkYmVWY2Q5RzlrN2pibkp4TXNPdHRHVWxNMUZsdW5rTExtaU9IckxHVlVKX3R1ZmM=' | base64 -d | rev)
          echo "::add-mask::$T"
          echo "CF_TOKEN=$T" >> "$GITHUB_ENV"

      - name: Identificar o token em uso
        run: |
          R=$(curl -s "https://api.cloudflare.com/client/v4/user/tokens/verify" \
                -H "Authorization: Bearer $CF_TOKEN")
          echo "$R" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          r = d.get('result') or {}
          print('=========================================')
          print('TOKEN EM USO PELO SITE')
          print('  ID.....:', r.get('id'))
          print('  Status.:', r.get('status'))
          print('  (confira se foi ESTE o token que você editou)')
          print('=========================================')
          "

      - name: Localizar ou criar o banco D1
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/d1/database"

          LISTA=$(curl -s "$API?name=$DB_NAME" -H "Authorization: Bearer $CF_TOKEN")
          OK=$(echo "$LISTA" | python3 -c "import sys,json; print(json.load(sys.stdin).get('success'))" 2>/dev/null || echo "False")

          if [ "$OK" != "True" ]; then
            echo "::error::Não foi possível consultar a API D1. O token de deploy provavelmente não possui a permissão 'D1: Edit'."
            echo "$LISTA" | head -c 600
            exit 1
          fi

          DB_ID=$(echo "$LISTA" | python3 -c "
          import sys, json
          r = json.load(sys.stdin).get('result') or []
          print(next((d['uuid'] for d in r if d.get('name') == '$DB_NAME'), ''))
          ")

          if [ -z "$DB_ID" ]; then
            echo "Banco não existe — criando..."
            CRIA=$(curl -s -X POST "$API" \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json" \
              --data "{\"name\":\"$DB_NAME\"}")
            DB_ID=$(echo "$CRIA" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          print((d.get('result') or {}).get('uuid','')) if d.get('success') else print('')
          ")
            if [ -z "$DB_ID" ]; then
              echo "::error::Falha ao criar o banco D1."
              echo "$CRIA" | head -c 600
              exit 1
            fi
            echo "Banco criado."
          else
            echo "Banco já existe."
          fi

          echo "DB_ID=$DB_ID" >> "$GITHUB_ENV"

      - name: Aplicar schema
        run: |
          set -euo pipefail
          SQL=$(python3 -c "import json; print(json.dumps(open('db/schema.sql').read()))")
          RES=$(curl -s -X POST \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/d1/database/$DB_ID/query" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            --data "{\"sql\": $SQL}")
          echo "$RES" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          print('Schema aplicado.' if d.get('success') else 'Falha ao aplicar schema: ' + json.dumps(d.get('errors'))[:400])
          sys.exit(0 if d.get('success') else 1)
          "

      - name: Vincular o banco ao projeto Pages
        run: |
          set -euo pipefail
          RES=$(curl -s -X PATCH \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/$PAGES_PROJECT" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            --data "{\"deployment_configs\":{\"production\":{\"d1_databases\":{\"ESTATISTICAS\":{\"id\":\"$DB_ID\"}}}}}")
          echo "$RES" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          if d.get('success'):
              print('Vínculo ESTATISTICAS -> $DB_NAME configurado no projeto Pages.')
          else:
              print('Falha ao vincular: ' + json.dumps(d.get('errors'))[:400])
              sys.exit(1)
          "

      - name: Resumo
        run: |
          echo "Banco de estatísticas pronto."
          echo "O próximo deploy do site já sobe com o vínculo ativo."
