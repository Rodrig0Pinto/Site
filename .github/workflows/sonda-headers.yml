# SONDA TEMPORÁRIA (somente leitura HTTP). Remover após rodar.
name: Sonda Headers
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sonda-headers.yml']
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: |
          B=https://rodrigopinto-adv-br.pages.dev
          for f in / /css/style.css /js/main.js /img/logo-128.webp /fonts/cinzel.woff2 /feed.xml /.well-known/security.txt /dados/clientes.enc.json; do
            echo "== $f"
            curl -sSI "$B$f" | grep -iE "^(HTTP|cache-control|content-type|strict-transport|x-robots)" | sed 's/^/   /'
          done
          echo "== feed: itens e 1º título"; curl -sS "$B/feed.xml" | grep -c "<item>" ; curl -sS "$B/feed.xml" | grep -m1 -oE "<item>.{0,120}" 
          echo "== security.txt:"; curl -sS "$B/.well-known/security.txt" | head -5
          echo "== home: preload do hero + autodiscovery RSS"; curl -sS "$B/" | grep -oE 'preload" href="img/bg-hero[^>]{0,80}|rel="alternate" type="application/rss\+xml"' | head -3
